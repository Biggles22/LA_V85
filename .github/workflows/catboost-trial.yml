name: LA V85 – CatBoost research benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catboost-trial.yml"
      - "scripts/catboost_trial.py"
      - "scripts/walkforward_evaluation.py"
      - "scripts/train_historical_pilot.py"
      - "research/historical_pilot_2026.json"
permissions:
  contents: write
concurrency:
  group: la-v85-catboost-trial
  cancel-in-progress: false
jobs:
  catboost-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible benchmark dependencies
        run: python -m pip install "catboost>=1.2,<2" "numpy>=1.26,<3" "scikit-learn>=1.5,<2" "xgboost>=2.1,<4"
      - name: Validate and evaluate CatBoost on future dates
        run: python scripts/catboost_trial.py
      - name: Publish only the reproducible research report
        run: |
          cp research/catboost_trial_2026.json "$RUNNER_TEMP/catboost_candidate.json"
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json, os, pathlib, shutil
          src = pathlib.Path(os.environ["RUNNER_TEMP"]) / "catboost_candidate.json"
          proposed = json.loads(src.read_text())
          target = pathlib.Path("research/catboost_trial_2026.json")
          if target.exists():
              old = json.loads(target.read_text())
              comparable = lambda d: {k:v for k,v in d.items() if k != "generatedAt"}
              if comparable(proposed) == comparable(old):
                  print("CatBoost report unchanged.")
                  raise SystemExit(0)
              if proposed.get("sourceRaceCount", 0) < old.get("sourceRaceCount", 0):
                  print("Refusing smaller historical sample.")
                  raise SystemExit(0)
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(src, target)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/catboost_trial_2026.json
          if ! git diff --cached --quiet; then
            git commit -m "Record chronological CatBoost V85 benchmark [skip ci]"
            git push origin HEAD:main
          else
            echo "Nothing new to commit."
          fi
