name: Verify V75travet production

on:
  push:
    branches: [main]
    paths:
      - 'uppdateringar/**/index.html'
      - 'efteranalys/**/index.html'
      - '.github/workflows/verify-production.yml'
      - 'scripts/cloudflare_access.py'
      - 'scripts/verify_deployment.py'
  workflow_dispatch:
    inputs:
      report_path:
        description: 'Report path, for example /uppdateringar/2026-11-26/. Leave blank for the current overview.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: v75travet-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check protected live publication
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REPORT_PATH: ${{ inputs.report_path }}
          V75_CF_ACCESS_CLIENT_ID: ${{ secrets.V75_CF_ACCESS_CLIENT_ID }}
          V75_CF_ACCESS_CLIENT_SECRET: ${{ secrets.V75_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -z "$V75_CF_ACCESS_CLIENT_ID" || -z "$V75_CF_ACCESS_CLIENT_SECRET" ]]; then
            {
              echo '## Protected live site remains unverified'
              echo
              echo 'Configure these environment secrets in v75travet-production:'
              [[ -n "$V75_CF_ACCESS_CLIENT_ID" ]] || echo '- V75_CF_ACCESS_CLIENT_ID'
              [[ -n "$V75_CF_ACCESS_CLIENT_SECRET" ]] || echo '- V75_CF_ACCESS_CLIENT_SECRET'
              echo
              echo '[Open environment settings](https://github.com/Biggles22/LA_V85/settings/environments)'
            } >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Live site unverified. Configure both Cloudflare Access secrets in v75travet-production.'
            exit 1
          fi

          reports=()
          if [[ -n "$REPORT_PATH" ]]; then
            reports=("${REPORT_PATH#/}index.html")
          elif [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            mapfile -t reports < <(git diff --name-only --diff-filter=AM "$BEFORE_SHA" HEAD |
              grep -E '^(uppdateringar|efteranalys)/[0-9]{4}-[0-9]{2}-[0-9]{2}/index\.html$')
          fi
          if (( ${#reports[@]} == 0 )); then
            overview=$(python3 -c 'import json; c=json.load(open("rounds.json")); print(next(r["overview"] for r in c["rounds"] if r["id"] == c["current"]))')
            reports=("${overview}index.html")
          fi

          for report in "${reports[@]}"; do
            if [[ ! "$report" =~ ^(uppdateringar|efteranalys)/[0-9]{4}-[0-9]{2}-[0-9]{2}/index\.html$ || ! -f "$report" ]]; then
              echo '::error::Expected a dated report present in this commit.'
              exit 1
            fi
            url_path="/${report%index.html}"
            for attempt in 1 2 3 4 5; do
              if python3 scripts/verify_deployment.py --path "$url_path" --expect-file "$report"; then
                printf 'Verified %s for %s\n' "$url_path" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                break
              fi
              if (( attempt == 5 )); then
                echo "::error::Protected live content unverified for $url_path"
                exit 1
              fi
              sleep 15
            done
          done
