name: Bjerke V85 startlist and market snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bjerke-hourly.yml"
      - "scripts/update_bjerke.py"
  schedule:
    - cron: "0 7,12,18 27-29 10 *"
    - cron: "0 6-22 30 10 *"
    - cron: "0 0-12 31 10 *"
permissions:
  contents: write
concurrency:
  group: bjerke-v85-snapshot
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate 8 ATG races
        run: python scripts/update_bjerke.py
      - name: Commit changed ATG snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bjerke-20261031.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Bjerke V85 ATG startlist and odds [skip ci]"
            git push
          fi
