name: LA V85 - freeze independent prestart AI forecasts
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Research freeze window (only allowed at its actual time)"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - friday
          - saturday
  push:
    branches: [main]
    paths:
      - ".github/workflows/freeze-v85-forecasts.yml"
      - "scripts/freeze_v85_forecasts.py"
      - "tests/test_freeze_v85_forecasts.py"
  schedule:
    # Sweden CET UTC+1 at Bjerke 2026-10-31. Github schedules are best-effort.
    - cron: "0 17 30 10 *"  # Fri Oct 30 18:00 Swedish time
    - cron: "13 18 30 10 *" # Fri backup Oct 30 19:13 Swedish time
    - cron: "15 13 31 10 *" # Sat Oct 31 14:15 Swedish time
    - cron: "31 13 31 10 *" # Sat backup Oct 31 14:31 Swedish time
permissions:
  contents: write
concurrency:
  group: la-v85-frozen-forecast-bjerke
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run prospective timestamp, source and identity tests
        run: python -m unittest discover -s tests -p "test_freeze_v85_forecasts.py"
      - name: Install modelling libraries
        run: python -m pip install "xgboost>=2.1,<4" "scikit-learn>=1.5,<2"
      - name: Freeze identical market and both independent forecasts
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          if test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
            SLOT="${MANUAL_SLOT:-preview}"
          elif test "$GITHUB_EVENT_NAME" = "push"; then
            # Recovery path if GitHub's best-effort cron was delayed/missed.
            # Use actual Swedish clock time, never backdate a forecast.
            LOCAL_DAY=$(TZ=Europe/Stockholm date +%Y-%m-%d)
            LOCAL_CLOCK=$(TZ=Europe/Stockholm date +%H%M)
            if test "$LOCAL_DAY" = "2026-10-30" && [ "$LOCAL_CLOCK" -ge 1800 ]; then
              SLOT=friday
            elif test "$LOCAL_DAY" = "2026-10-31" && [ "$LOCAL_CLOCK" -ge 1415 ] && [ "$LOCAL_CLOCK" -lt 1500 ]; then
              SLOT=saturday
            else
              SLOT=preview
            fi
          else
            case "$GITHUB_EVENT_SCHEDULE" in
              "0 17 30 10 *"|"13 18 30 10 *") SLOT=friday;;
              "15 13 31 10 *"|"31 13 31 10 *") SLOT=saturday;;
              *) SLOT=preview;;
            esac
          fi
          echo "Selected prospective slot: $SLOT; Swedish time: $(TZ=Europe/Stockholm date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"
          python scripts/freeze_v85_forecasts.py --slot "$SLOT"
      - name: Publish one immutable result per slot on latest main
        run: |
          target="research/frozen/2026-10-31/${SLOT}.json"
          if test ! -f "$target"; then
            echo "No in-window verified prospective report; no commit."
            exit 0
          fi
          cp "$target" "$RUNNER_TEMP/frozen_candidate.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p research/frozen/2026-10-31
            # git reset does NOT remove the untracked file created in this run.
            # Check the REMOTE COMMIT, not whether the runner filesystem has it.
            if git cat-file -e "origin/main:$target" 2>/dev/null; then
              echo "Immutable slot already published; never overwrite."
              exit 0
            fi
            cp "$RUNNER_TEMP/frozen_candidate.json" "$target"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$target"
            if git diff --cached --quiet; then
              echo "Unchanged; no commit."
              exit 0
            fi
            git commit -m "Freeze before-start ${SLOT} Bjerke research forecast [skip ci]"
            if git push origin HEAD:main; then
              echo "Immutable research published: $target"
              exit 0
            fi
            echo "Concurrent main update; retrying without overwriting other work."
          done
          echo "Failed to publish without a conflict."
          exit 1
