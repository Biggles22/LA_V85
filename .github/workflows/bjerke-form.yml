name: Bjerke V85 - verified historical form
# 2026-10-31 morning final form refresh trigger; logic unchanged.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bjerke-form.yml"
      - "scripts/update_bjerke_form.py"
      - "tests/test_bjerke_form.py"
  schedule:
    # CET = UTC+1 on Bjerke race weekend; refresh hourly before off.
    - cron: "39 16-22 30 10 *"
    - cron: "39 6-13 31 10 *"
permissions:
  contents: write
concurrency:
  group: bjerke-v85-form
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test verified historical form processing
        run: python -m unittest discover -s tests -p "test_bjerke_form.py"
      - name: Refresh Bjerke historical form from latest market snapshot
        run: |
          git fetch origin main
          git reset --hard origin/main
          python scripts/update_bjerke_form.py
      - name: Safely publish updated form evidence only
        run: |
          if git diff --quiet -- bjerke-form-20261031.json; then
            echo "No changed historical form."
            exit 0
          fi
          cp bjerke-form-20261031.json "$RUNNER_TEMP/form_candidate.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json,os,pathlib,shutil
          file=pathlib.Path(os.environ["RUNNER_TEMP"])/"form_candidate.json"
          new=json.loads(file.read_text(encoding="utf8"))
          dest=pathlib.Path("bjerke-form-20261031.json")
          old=json.loads(dest.read_text(encoding="utf8")) if dest.exists() else {}
          if old.get("atgSourceAt") and new.get("atgSourceAt") and (
              str(new["atgSourceAt"])<str(old["atgSourceAt"])
          ):
              print("Newer form source already on main; retain it.")
              raise SystemExit(0)
          if (old.get("coverage",{}).get("failedRaces",8)
              <new.get("coverage",{}).get("failedRaces",8)
              and old.get("atgSourceAt")==new.get("atgSourceAt")):
              print("Current form has fewer missing races; retain it.")
              raise SystemExit(0)
          if old==new:
              print("Form candidate already published.")
              raise SystemExit(0)
          shutil.copy2(file,dest)
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bjerke-form-20261031.json
            if git diff --cached --quiet; then
              echo "No safe form change needed."
              exit 0
            fi
            git commit -m "Update Bjerke verified historical form evidence [skip ci]"
            if git push origin HEAD:main; then
              echo "Published updated Bjerke historical form."
              exit 0
            fi
            echo "Concurrent main update; safely retry."
          done
          echo "Failed to publish updated form after three attempts."
          exit 1
