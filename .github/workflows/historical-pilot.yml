name: LA V85 historical data quality and v2 evaluation
on:
  workflow_dispatch:
    inputs:
      collect:
        description: Fetch historical raw ATG sources before evaluating
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-pilot.yml"
      - "scripts/data_quality.py"
      - "scripts/historical_pilot.py"
      - "scripts/train_historical_pilot.py"
      - "scripts/walkforward_evaluation.py"
      - "tests/test_data_quality.py"
      - "tests/test_historical_pilot.py"
      - "tests/test_walkforward.py"
permissions:
  contents: write
concurrency:
  group: la-v85-historical-pilot
  cancel-in-progress: false
jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model and test dependencies
        run: python -m pip install "xgboost>=2.1,<4" "scikit-learn>=1.5,<2" "numpy>=1.26,<3"
      - name: Test parsing, complete fields and time separation
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Collect versioned raw historical sources when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.collect
        run: python scripts/historical_pilot.py
      - name: Audit and evaluate the gated training data
        run: |
          python scripts/data_quality.py
          python scripts/train_historical_pilot.py
          python scripts/walkforward_evaluation.py
      - name: Publish v2 evidence without replacing legacy reports
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main changed during evaluation; retaining newer work. Rerun on latest main."
            exit 0
          fi
          git add research/training_data_quality_2026.json research/model_report_v2.json research/walkforward_report_v2.json
          if test -f research/historical_pilot_v2.json; then
            git add research/historical_pilot_v2.json
          fi
          if test -d research/raw-history; then
            git add research/raw-history
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Record V85 data quality and versioned evaluation [skip ci]"
            git push origin HEAD:main
          fi
