name: LA V85 historical pilot and XGBoost evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-pilot.yml"
      - "scripts/historical_pilot.py"
      - "scripts/train_historical_pilot.py"
      - "tests/test_historical_pilot.py"
permissions:
  contents: write
concurrency:
  group: la-v85-historical-pilot
  cancel-in-progress: false
jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run leakage and data-validation tests
        run: python -m unittest discover -s tests -p "test_historical_pilot.py"
      - name: Install pinned-compatible XGBoost dependencies
        run: python -m pip install "xgboost>=2.1,<4" "scikit-learn>=1.5,<2"
      - name: Collect historical completed V85 rounds
        run: python scripts/historical_pilot.py --limit 10
      - name: Train on older races; evaluate on newer unseen races
        run: python scripts/train_historical_pilot.py
      - name: Commit only verified research data and evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/historical_pilot_2026.json research/model_report_2026.json
          if ! git diff --cached --quiet; then
            git commit -m "Collect verified historical V85 pilot and time-split evaluation [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Research unchanged; no new commit."
          fi
