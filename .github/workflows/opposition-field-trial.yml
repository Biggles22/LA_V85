name: LA V85 – historic field-opposition feature test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opposition-field-trial.yml"
      - "scripts/opposition_field_trial.py"
      - "tests/test_opposition_field_trial.py"
permissions:
  contents: write
concurrency:
  group: la-v85-opposition-field-trial
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research model packages
        run: python -m pip install "xgboost>=2.1,<4" "scikit-learn>=1.5,<2"
      - name: Test field-strength evidence for leaks and missing data
        run: python -m unittest discover -s tests -p "test_opposition_field_trial.py"
      - name: Compare baseline and field opposition with same walk-forward folds
        run: python scripts/opposition_field_trial.py
      - name: Publish only verified research to latest main
        run: |
          cp research/opposition_field_trial_2026.json "$RUNNER_TEMP/opposition_candidate.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json,os,pathlib,shutil
          candidate=pathlib.Path(os.environ["RUNNER_TEMP"])/"opposition_candidate.json"
          new=json.loads(candidate.read_text())
          dest=pathlib.Path("research/opposition_field_trial_2026.json")
          if dest.exists():
              old=json.loads(dest.read_text())
              if old==new or (old.get("heldOutRaces",0)>new["heldOutRaces"]):
                  print("Existing validated report retained.")
                  raise SystemExit(0)
          dest.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy2(candidate,dest)
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/opposition_field_trial_2026.json
            if git diff --cached --quiet; then
              echo "No verified report changes."
              exit 0
            fi
            git commit -m "Archive chronological field opposition test [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent push; retrying from latest main."
          done
          echo "Could not push without conflict."
          exit 1
