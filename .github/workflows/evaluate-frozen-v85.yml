name: LA V85 - score frozen Bjerke forecasts after results
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluate-frozen-v85.yml"
      - "scripts/evaluate_frozen_v85.py"
      - "tests/test_evaluate_frozen_v85.py"
  schedule:
    # Sunday Nov 1 2026 CET; retry automatically if verified results are late.
    - cron: "0 8,11,15 1 11 *"
permissions:
  contents: write
concurrency:
  group: la-v85-bjerke-frozen-evaluation
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check eight winners, time cutoffs and immutable forecasts
        run: python -m unittest discover -s tests -p "test_evaluate_frozen_v85.py"
      - name: Compare ONLY stored prestart forecasts to official race results
        run: python scripts/evaluate_frozen_v85.py
      - name: Publish immutable verification after complete ATG results
        run: |
          target=research/frozen/2026-10-31/evaluation.json
          if test ! -f "$target"; then
            echo "No verified results report; no commit."
            exit 0
          fi
          cp "$target" "$RUNNER_TEMP/outcome_candidate.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # git reset does NOT remove the untracked file created in this run.
            # Check the REMOTE COMMIT, not whether the runner filesystem has it.
            if git cat-file -e "origin/main:$target" 2>/dev/null; then
              echo "Report already frozen on main; never overwrite."
              exit 0
            fi
            mkdir -p research/frozen/2026-10-31
            cp "$RUNNER_TEMP/outcome_candidate.json" "$target"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$target"
            git commit -m "Score original frozen Bjerke predictions after official results [skip ci]"
            if git push origin HEAD:main; then
              echo "Result comparison verified and published."
              exit 0
            fi
            echo "Concurrent commit; retry from latest main."
          done
          echo "Unable to publish without concurrent changes."
          exit 1
