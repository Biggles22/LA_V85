name: Gävle V85 hourly odds, turnover and stable metadata
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gavle-hourly.yml"
      - "scripts/update_gavle.py"
  workflow_dispatch:
  schedule:
    - cron: "0 9-12 17 10 *" # 11, 12, 13, 14 Stockholm (17 October, summer time)
permissions:
  contents: write
concurrency:
  group: gavle-v85-update
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture ATG pre-start snapshot
        run: python scripts/update_gavle.py
      - name: Commit verified snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add startlist.json odds.json turnover.json gavle-analysis.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Gävle pre-start ATG V85 snapshots [skip ci]"
            git push
          fi
