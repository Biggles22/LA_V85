name: LA V85 – Historical opponents with validated fields
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-opponent-test.yml"
      - "scripts/historical_opponent_test.py"
      - "scripts/data_quality.py"
      - "scripts/walkforward_evaluation.py"
      - "scripts/train_historical_pilot.py"
      - "research/historical_pilot_v2.json"
permissions:
  contents: write
concurrency:
  group: la-v85-historical-opponent-test
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: python -m pip install "catboost>=1.2,<2" "numpy>=1.26,<3" "scikit-learn>=1.5,<2" "xgboost>=2.1,<4"
      - name: Evaluate gated data or record insufficient-data status
        run: python scripts/historical_opponent_test.py
      - name: Publish versioned report from unchanged input revision
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main changed during evaluation; retaining newer work. Rerun on latest main."
            exit 0
          fi
          git add research/historical_opponent_test_v2.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Record Historical opponents v2 data-quality result [skip ci]"
            git push origin HEAD:main
          fi
