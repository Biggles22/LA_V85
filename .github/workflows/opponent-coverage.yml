name: LA V85 – expanded dated opponent research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opponent-coverage.yml"
      - "scripts/opponent_coverage.py"
      - "tests/test_opponent_coverage.py"
permissions:
  contents: write
concurrency:
  group: la-v85-opponent-coverage
  cancel-in-progress: false
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check time safety, representative selection and unknown results
        run: python -m unittest discover -s tests -p "test_opponent_coverage.py"
      - name: Fetch bounded evidence for Bjerke's current runners
        run: python scripts/opponent_coverage.py
      - name: Publish research only without clobbering newer main
        run: |
          cp research/opponent_coverage_2026.json "$RUNNER_TEMP/opponent_candidate.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json,os,pathlib,shutil
          candidate=pathlib.Path(os.environ["RUNNER_TEMP"])/"opponent_candidate.json"
          new=json.loads(candidate.read_text())
          target=pathlib.Path("research/opponent_coverage_2026.json")
          if target.exists():
              old=json.loads(target.read_text())
              if (old.get("schemaVersion")==2 and
                  old.get("activeHorses")==new.get("activeHorses") and
                  old.get("readableDistinctRaces",0)>new["readableDistinctRaces"]):
                  print("Existing archive has more verified races. Keeping it.")
                  raise SystemExit(0)
              if old==new:
                  print("No new opponent evidence.")
                  raise SystemExit(0)
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy2(candidate,target)
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/opponent_coverage_2026.json
            if git diff --cached --quiet; then
              echo "No verified changes; no commit."
              exit 0
            fi
            git commit -m "Archive broadened dated rival-history coverage [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; will retry from latest main."
          done
          echo "Push blocked after three safe retries."
          exit 1
